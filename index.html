      <div class="tablewrap"><table><thead><tr><th></th><th>Unidade · cliente (arquivo)</th><th>Parcela</th><th>Venda no sistema</th><th class="r">Valor bruto</th><th class="r">Nota</th><th class="r" style="color:var(--ok)">Corretor</th><th class="r" style="color:var(--gold)">Imobiliária</th></tr></thead><tbody>${body}</tbody></table></div>
      ${byCor.size ? `<div class="fs" style="margin-top:12px"><h3>A pagar por corretor</h3><div class="kv">${[...byCor.entries()].sort((a,b) => b[1]-a[1]).map(([n,v]) => `<div><span>${esc(n)}</span><b class="num">${brl(v)}</b></div>`).join("")}</div></div>` : ""}
      <div class="toolbar" style="justify-content:flex-end;margin-top:12px"><label style="font-size:13px;display:flex;gap:6px;align-items:center">Data da baixa <select id="ibDt"><option value="arq">Vencimento da planilha</option><option value="hoje">Hoje</option></select></label><button class="btn" id="ibRep">Baixar planilha de repasse</button><button class="btn pri" id="ibGo" ${T3.n ? "" : "disabled"}>Confirmar ${T3.n} baixas</button></div>`;
  };
  draw();
  out.onchange = e => { const c = e.target.closest("[data-on]"); if (c){ rows[+c.dataset.on].on = c.checked; return draw(); }
    const s = e.target.closest("[data-sel]"); if (!s) return; const r = rows[+s.dataset.sel];
    if (s.value === "__busca") return pickSale(r.l, id => { const x = st.vendas.get(id); if (x && !r.C.includes(x)) r.C.unshift(x); r.pick = id; r.dup = alreadyImported(x, payRef(r.l)); r.on = true; draw(); }, () => draw());
    r.pick = s.value; const x = st.vendas.get(r.pick); r.dup = x ? alreadyImported(x, payRef(r.l)) : false; r.on = true; draw(); };
  out.onclick = async e => {
    if (e.target.id === "ibRep"){ try { await libXLSX(); } catch { return toast("Não foi possível carregar o gerador de planilhas."); }
      const data = rows.filter(r => r.pick).map(r => { const s = st.vendas.get(r.pick), sp = splitLine(s, r.l.valor); return {"Unidade": r.l.unidade, "Cliente": r.l.cliente, "Contrato": r.l.contrato, "Valor": r.l.valor, "Parcela": `${r.l.parcela}/${r.l.de}`, "Vencimento": dBR(r.l.data), "PERCENTUAL": +(r.l.valor * sp.pct / 100).toFixed(2), ["NOTA " + fmtQ(sp.notaPct) + "%"]: +(r.l.valor * sp.pct / 100 * sp.notaPct / 100).toFixed(2), "COMISSÃO": sp.cor, "CORRETOR": s.broker_name, "IMOBILIÁRIA": sp.imob, "SITUAÇÃO": r.dup ? "JÁ IMPORTADA" : "PAGAR"}; });
      const ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Repasse"); return saveFile(`repasse-corretores-${T}.xlsx`, new Blob([XLSX.write(wb, {bookType: "xlsx", type: "array"})], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})); }
    if (e.target.id === "ibGo"){ const sel = rows.filter(r => r.pick && !r.dup && r.on !== false), useToday = $("#ibDt").value === "hoje"; let n = 0, tc = 0;
      for (const r of sel){ const s = st.vendas.get(r.pick); if (!s || alreadyImported(s, payRef(r.l))) continue; const {nn, sp} = applyConstrutoraPayment(s, r.l, useToday ? T : r.l.data); n++; tc += sp.cor;
        audit("baixa", nn, `Construtora ${fname}: parcela ${r.l.parcela}/${r.l.de} · bruto ${brl(r.l.valor)} · nota ${brl(sp.nota)} · corretor ${brl(sp.cor)} (${fmtQ(sp.pct)}%) · imobiliária ${brl(sp.imob)}`);
        for (const b of brokersOf(nn)){ const u = b.owner_id || (resolveUser(b.name) || {}).id; if (u) aviso("comissao", `Comissão recebida da construtora: ${commTitle(nn)} · parcela ${r.l.parcela}/${r.l.de} · sua parte ${brl(sp.cor * b.share)}.`, u, {sale_id: nn.id}); } }
      aviso("comissao", `${n} baixas importadas de ${fname} · corretores ${brl(tc)}.`, "gestor"); toast(`${n} baixas lançadas`); f3Importar(B); }
  };
}
function pickSale(l, onPick, onCancel){
  const d = $("#dlg"), had = d.open; const prevHTML = had ? d.innerHTML : null;
  const html = `<div class="dlg" style="max-width:640px"><div class="dh"><div style="flex:1"><h2>Escolher a venda</h2><p>${esc(l.unidade || "")} · ${esc(l.cliente || "")}</p></div><button class="btn icon" data-pk-x aria-label="Fechar">✕</button></div><div class="db"><input type="search" id="psQ" placeholder="Buscar por cliente, loteamento ou quadra/lote" value="${esc(l.cliente || "")}" aria-label="Buscar venda"><div id="psL" class="lst"></div></div></div>`;
  modal(html); const draw = () => { const q = norm($("#psQ").value); const L = allSales().filter(s => isActive(s) && (!q || q.split(" ").every(w => norm([s.client_name, s.property_name, "q" + s.quadra, "l" + s.lote, s.quadra + " " + s.lote].join(" ")).includes(w)))).slice(0, 30);
    $("#psL").innerHTML = L.map(s => `<button class="btn" data-ps="${esc(s.id)}" style="justify-content:flex-start;height:auto;padding:8px 12px;white-space:normal;text-align:left"><span><b>${esc(s.client_name) || "—"}</b> · ${esc(s.property_name)} Q${esc(s.quadra)} L${esc(s.lote)}<span style="display:block;font-weight:400;font-size:12px;color:var(--mfg)">${dBR(s.sale_date)} · ${esc(s.broker_name)} · comissão ${brl(s.commission_value)}</span></span></button>`).join("") || `<p style="color:var(--mfg)">Nenhuma venda encontrada.</p>`; };
  $("#psQ").oninput = draw; draw();
  $("#dlg").onclick = e => { const b = e.target.closest("[data-ps]"); if (b){ $("#dlg").close(); onPick(b.dataset.ps); } if (e.target.closest("[data-pk-x]")){ $("#dlg").close(); onCancel && onCancel(); } };
}

/* ---- "+ Adicionar comissão": já procura a venda; avulsa é uma opção ---- */
function openAvulsa(){
  modal(`<div class="dlg" style="max-width:660px"><div class="dh"><div style="flex:1"><h2>Adicionar comissão</h2><p>Procure a venda para editar a comissão dela ou somar uma comissão extra. Sem venda? Marque “avulsa”.</p></div><button class="btn icon" data-x aria-label="Fechar">✕</button></div>
    <div class="db"><input type="search" id="acQ" placeholder="Buscar venda por cliente, loteamento ou quadra/lote" aria-label="Buscar venda"><div id="acL" class="lst"></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;border-top:1px solid var(--border);padding-top:12px"><input type="checkbox" class="chk" id="acAv"> Comissão avulsa (sem venda): bônus, indicação, locação, ajuste…</label></div></div>`);
  const draw = () => { const q = norm($("#acQ").value); if (!q){ $("#acL").innerHTML = `<p style="margin:0;color:var(--mfg);font-size:13px">Digite para procurar.</p>`; return; } const L = allSales().filter(s => isActive(s) && q.split(" ").every(w => norm([s.client_name, s.property_name, "q" + s.quadra, "l" + s.lote, s.quadra + " " + s.lote, s.broker_name].join(" ")).includes(w))).slice(0, 20);
    $("#acL").innerHTML = L.map(s => { const t = commSummary(s); return `<div class="card" style="padding:10px 12px;box-shadow:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>${esc(s.client_name) || "—"}</b> · ${esc(s.property_name)} Q${esc(s.quadra)} L${esc(s.lote)}<span style="display:block;font-size:12px;color:var(--mfg)">${dBR(s.sale_date)} · ${esc(s.broker_name)} · comissão ${brl(t.liq)} · ${t.nRec}/${t.n} parcelas</span></div><button class="btn sm pri" data-ac-ed="${esc(s.id)}">Editar comissão</button><button class="btn sm" data-ac-x="${esc(s.id)}">+ Comissão extra</button></div>`; }).join("") || `<p style="color:var(--mfg)">Nenhuma venda encontrada.</p>`; };
  $("#acQ").oninput = draw; draw();
  $("#dlg").addEventListener("click", e => { const ed = e.target.closest("[data-ac-ed]"); if (ed){ $("#dlg").close(); return openFicha(ed.dataset.acEd); } const x = e.target.closest("[data-ac-x]"); if (x) return extraForm(st.vendas.get(x.dataset.acX)); });
  $("#acAv").onchange = e => { if (e.target.checked) extraForm(null); };
}
function extraForm(link){
  const brs = knownBrokers();
  modal(`<form class="dlg" novalidate style="max-width:620px"><div class="dh"><div style="flex:1"><h2>${link ? "Comissão extra nesta venda" : "Comissão avulsa"}</h2><p>${link ? esc(link.client_name + " · " + link.property_name + " Q" + link.quadra + " L" + link.lote) : "Não ligada a venda"}</p></div><button type="button" class="btn icon" data-x aria-label="Fechar">✕</button></div>
    <div class="db"><div class="g"><label class="f" style="grid-column:1/-1">Descrição *<input type="text" name="t" id="av_t" placeholder="ex.: Bônus de meta, comissão de locação, ajuste"></label>
      <label class="f">Corretor *<input type="text" name="b" id="av_b" list="dlAvB" value="${esc(link ? link.broker_name : "")}"><datalist id="dlAvB">${brs.map(b => `<option value="${esc(b)}">`).join("")}</datalist></label><label class="f">% do corretor<input type="text" inputmode="decimal" name="pct" id="av_p" value="${link ? String(pctFor(link)).replace(".", ",") : "100"}"></label>
      <label class="f">Valor total (R$) *<input type="text" inputmode="decimal" name="v" id="av_v"></label><label class="f">Nº de parcelas<input type="number" min="1" max="120" name="n" id="av_n" value="1"></label>
      <label class="f">1º vencimento<input type="date" name="d" id="av_d" value="${T}"></label>${link ? "" : `<label class="f">Cliente (opcional)<input type="text" name="c" id="av_c"></label>`}</div><div id="avWarn"></div></div>
    <div class="df"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">Criar e abrir ficha</button></div></form>`, fd => {
    const t = fv(fd, "t"), b = fv(fd, "b"), v = parseMoney(fv(fd, "v")), n = Math.max(1, parseInt(fv(fd, "n")) || 1); if (!t || !b || !(v > 0)) return $("#avWarn").innerHTML = `<div class="alert e">Preencha descrição, corretor e valor.</div>`;
    const u = resolveUser(b), d1 = fv(fd, "d") || T, per = +(v / n).toFixed(2); let acc = 0;
    const P = Array.from({length: n}, (_, i) => { const c = i === n-1 ? +(v - acc).toFixed(2) : per; acc += per; return {n: i+1, venc: addMonths(d1, i), cheia: c, construtora: 0, desconto: 0, tipo: "normal", recebida: false, data_receb: "", pago: 0, payments: []}; });
    const base = {id: rid("avl"), avulsa: true, titulo: t, sale_id: link ? link.id : null, property_name: link ? link.property_name : "", quadra: link ? link.quadra : "", lote: link ? link.lote : "", client_name: link ? link.client_name : (fv(fd, "c") || ""), broker_name: b, brokers: [{name: b, split_pct: 100, owner_id: u ? u.id : null}], broker_ids: u ? [u.id] : [], owner_id: u ? u.id : null, broker_split: Math.min(100, parseFloat(fv(fd, "pct").replace(",", ".")) || 100), sale_date: d1, sale_value: 0, created_at: nowISO()};
    const doc = writePlan(base, P); saveDoc("avulsas", doc); audit("create", doc, (link ? "Comissão extra: " : "Comissão avulsa: ") + t); $("#dlg").close(); toast("Comissão adicionada"); openFicha(doc.id);
  });
}

const VIEWS = {financeiro_rel: FinanceiroV2, mapa: MapaGeral, assistente: Assistente, painel: Painel, vendas: Vendas, financeiro: FinanceiroV3, clientes: Clientes, equipe: Equipe, agenda: Agenda, loteamentos: Loteamentos, auditoria: Auditoria};

/* ============ Inicialização ============ */
(async function boot(){
  const th = store.get("bri.theme"); if (th) document.documentElement.dataset.theme = th;
  const t = store.get("bri.tab"); if (t && ["painel","vendas","financeiro","clientes","equipe","agenda","loteamentos","mapa","auditoria","assistente"].includes(t)) ui.tab = t;
  try { db = window.claude ? await window.claude.use("db") : null; user = db ? await window.claude.use("user") : null; if (db){ assets = await window.claude.use("assets").catch(() => null); downloads = await window.claude.use("downloads").catch(() => null); } } catch (e) { db = null; }
  if (!db){ buildShell(); $("#main").innerHTML = `<div class="empty"><b>Não foi possível abrir os dados</b>Verifique a internet e recarregue a página.</div>`; return; }
  try { me = user ? await user.me() : null; isAdmin = !!(me && (me.isOwner || me.canEdit)); } catch { isAdmin = true; }
  try { room = await window.claude.use("room"); } catch { room = null; }
  try { ai = await window.claude.use("sample"); aiLimits = ai ? await ai.limits().catch(() => null) : null; } catch { ai = null; }
  if (!isAdmin){ canWrite = false; buildShell(); $("#btnExport").hidden = true; return bootCorretor(); }
  if (room) room.onPeers(ps => { peers = ps || []; if (mounted === "equipe") Equipe.update(); });
  try { const w = user && user.can ? await user.can("data.write") : null; canWrite = w !== false; } catch { canWrite = true; }
  const since = nowISO();
  try {
    const res = await Promise.all(COLS.map(c => loadAll(c)));
    COLS.forEach((c,i) => res[i].forEach(d => d && d.id && st[c].set(d.id, d)));
  } catch (e) { console.error(e); }
  buildShell();
  if (!st.vendas.size){ $("#main").innerHTML = `<div class="empty"><b>Sem dados por aqui</b>Você não tem acesso de gestor a este sistema, ou os dados ainda não foram importados.</div>`; return; }
  ["vendas","duplas","usuarios","corretores","metas","loteamentos","clientes","agenda","lot_media","avisos","avulsas"].forEach(c => liveSync(c, since));
  mountTab(); updateBell(); setTimeout(syncPortals, 1500);
  const imp = st.config.get("importacao");
  if (imp) document.body.insertAdjacentHTML("beforeend", `<div class="wrap" style="color:var(--mfg);font-size:12px;padding-bottom:24px">Dados importados do backup de ${dBR(imp.exportado_em)} · ${imp.docs && imp.docs.vendas} vendas (incluindo histórico de excluídas).</div>`);
})();
