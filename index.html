<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="/logo.webp">
<meta name="theme-color" content="#1a4636">
<title>Brilhante's Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: painel operacional — cabeçalho fixo com abas, conteúdo em grade de 1400px; verde-esmeralda + ouro do sistema original */
:root{
  --bg:hsl(210 20% 98%);--fg:hsl(165 30% 12%);--card:#fff;--muted:hsl(160 15% 94%);--mfg:hsl(160 8% 40%);
  --border:hsl(160 14% 88%);--primary:hsl(158 42% 18%);--pfg:#fafafa;--gold:hsl(43 60% 44%);--goldbg:hsl(43 55% 94%);
  --ok:hsl(160 84% 30%);--okbg:hsl(160 60% 93%);--warn:hsl(32 92% 40%);--warnbg:hsl(38 92% 93%);--bad:hsl(0 72% 48%);--badbg:hsl(0 84% 95%);
  --bar:hsl(158 42% 28%);--barhi:hsl(43 60% 48%);--grid:hsl(160 14% 91%);--shadow:0 1px 2px hsl(160 30% 10%/.06),0 4px 16px hsl(160 30% 10%/.05);
  --f-head:"Plus Jakarta Sans",system-ui,sans-serif;--f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(165 30% 6%);--fg:hsl(150 15% 92%);--card:hsl(165 26% 9%);--muted:hsl(165 18% 14%);--mfg:hsl(150 8% 62%);
  --border:hsl(165 18% 18%);--primary:hsl(158 50% 42%);--pfg:hsl(165 30% 6%);--gold:hsl(43 60% 56%);--goldbg:hsl(43 40% 14%);
  --ok:hsl(160 70% 48%);--okbg:hsl(160 50% 12%);--warn:hsl(38 90% 58%);--warnbg:hsl(38 60% 13%);--bad:hsl(0 72% 64%);--badbg:hsl(0 50% 15%);
  --bar:hsl(158 50% 44%);--barhi:hsl(43 60% 56%);--grid:hsl(165 18% 15%);--shadow:0 1px 2px #0006;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(165 30% 6%);--fg:hsl(150 15% 92%);--card:hsl(165 26% 9%);--muted:hsl(165 18% 14%);--mfg:hsl(150 8% 62%);
  --border:hsl(165 18% 18%);--primary:hsl(158 50% 42%);--pfg:hsl(165 30% 6%);--gold:hsl(43 60% 56%);--goldbg:hsl(43 40% 14%);
  --ok:hsl(160 70% 48%);--okbg:hsl(160 50% 12%);--warn:hsl(38 90% 58%);--warnbg:hsl(38 60% 13%);--bad:hsl(0 72% 64%);--badbg:hsl(0 50% 15%);
  --bar:hsl(158 50% 44%);--barhi:hsl(43 60% 56%);--grid:hsl(165 18% 15%);--shadow:0 1px 2px #0006;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
h1,h2,h3{font-family:var(--f-head);letter-spacing:-.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.top .row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.brand b{font-family:var(--f-head);font-weight:800;font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--mfg);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.period{display:flex;gap:6px;align-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--mfg);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
nav.tabs button:disabled{opacity:.45;cursor:default}
nav.tabs .soon{font-size:10px;font-weight:600;margin-left:4px;color:var(--mfg)}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--primary);color:var(--pfg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08);background:var(--primary)}
.btn.gold{background:var(--gold);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{width:36px;padding:0;justify-content:center}
select,input[type=text],input[type=date],input[type=number],input[type=search],input[type=email],input[type=tel],textarea{height:36px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:0 10px;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mfg);min-width:0}
label.f>input,label.f>select,label.f>textarea{color:var(--fg);font-weight:400;font-size:14px;width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mfg)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--pfg)}

main{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:26px;font-weight:800}
.pagehead p{margin:2px 0 0;color:var(--mfg)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.card>.hd h2{font-size:15px;font-weight:700}
.card>.bd{padding:14px 16px 16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mfg);font-weight:600}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;color:var(--mfg);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--primary))}
.kpi .val{font-size:clamp(16px,2.1vw,21px);font-weight:600;overflow-wrap:anywhere}
.kpi .sub{font-size:11px;color:var(--mfg)}
.split-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--muted);margin-top:6px;gap:2px}
.split-bar i{display:block;height:100%}

.grid3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid3{grid-template-columns:minmax(0,1fr)}}

/* Chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.chart text{fill:var(--mfg);font-size:11px;font-family:var(--f-body)}

/* Ranking */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.rank li:first-child{border-top:0}
.rank .pos{font-family:var(--f-mono);font-weight:600;color:var(--mfg);text-align:center}
.rank li:nth-child(1) .pos{color:var(--gold)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--goldbg);color:var(--gold);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.rank .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .meta{font-size:12px;color:var(--mfg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{text-align:right;font-size:13px}
.rank .track{height:4px;border-radius:2px;background:var(--muted);margin-top:4px}
.rank .track i{display:block;height:100%;border-radius:2px;background:var(--bar)}
.rank li:nth-child(1) .track i{background:var(--barhi)}

/* Table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px}
.tablewrap{overflow-x:auto;border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mfg);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--muted)}
td.r,th.r{text-align:right}
td .s{display:block;font-size:12px;color:var(--mfg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mut{background:var(--muted);color:var(--mfg)}.p-gold{background:var(--goldbg);color:var(--gold)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;color:var(--mfg);font-size:12px}

/* Dialogs */
dialog{border:0;padding:0;background:var(--card);color:var(--fg);border-radius:16px;box-shadow:0 20px 60px #0005;width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:hsl(165 30% 6%/.55)}
dialog.sheet{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:16px 0 0 16px;width:min(620px,100vw)}
dialog.sheet.wide{width:min(1000px,100vw)}
.dlg{display:flex;flex-direction:column;max-height:inherit;height:100%}
.dlg>.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.dlg>.dh h2{font-size:18px;font-weight:800}
.dlg>.dh p{margin:2px 0 0;color:var(--mfg);font-size:13px}
.dlg>.db{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.dlg>.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.fs{display:flex;flex-direction:column;gap:10px}
.fs>h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.calc{background:var(--muted);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.calc div span{display:block;font-size:11px;color:var(--mfg);font-weight:600}
.calc div b{font-family:var(--f-mono);font-weight:600}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .it{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid}
.alert.w{background:var(--warnbg);color:var(--fg);border-color:var(--warn)}
.alert.e{background:var(--badbg);border-color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kv div span{display:block;font-size:11px;color:var(--mfg);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv div b{font-weight:600}
.inst{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.chk{width:20px;height:20px;accent-color:var(--primary)}
.empty{padding:40px 16px;text-align:center;color:var(--mfg)}
.empty b{display:block;color:var(--fg);font-family:var(--f-head);font-size:16px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}.pagehead h1{font-size:22px}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="/js/adapter.js"></script>
</head>

const brl0 = v => N(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:0});
const fmtQ = v => { const n = N(v); return Number.isInteger(+n.toFixed(2)) ? String(Math.round(n)) : n.toLocaleString("pt-BR", {maximumFractionDigits:1}); };
const today = () => new Intl.DateTimeFormat("en-CA", {timeZone:"America/Sao_Paulo"}).format(new Date());
const nowISO = () => new Date().toISOString();
const dBR = iso => { if (!iso) return "—"; const [y,m,d] = String(iso).slice(0,10).split("-"); return d ? `${d}/${m}/${y}` : iso; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
const rid = p => p + "_" + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2,"0")).join("");
const parseMoney = s => { if (typeof s === "number") return s; s = String(s || "").replace(/[^\d,.-]/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ""); return parseFloat(s) || 0; };
const addMonths = (iso, n) => { const [y,m,d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate(); dt.setUTCDate(Math.min(d, last)); return dt.toISOString().slice(0,10); };
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES3 = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const initials = n => String(n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase() || "?";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600); }
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

/* ============ Regras de negócio (espelham o backend original) ============ */
const isDeleted = s => !!s.deleted_at;
const isCancelled = s => s.status === "cancelled";
const isActive = s => !isDeleted(s) && !isCancelled(s);
const inPeriod = (s, m, y) => { const sd = s.sale_date || ""; if (y && !sd.startsWith(String(y))) return false; if (m && +sd.slice(5,7) !== m) return false; return true; };
function brokerComm(s){ const bc = s.broker_commission, ac = s.agency_commission; if (bc != null && (bc || ac)) return N(bc); const sp = N(s.broker_split) || 60; return N(s.commission_value) * sp / 100; }
const agencyComm = s => N(s.commission_value) - brokerComm(s);
const commPending = s => Math.max(N(s.commission_value) - commReceived(s), 0);
const commOverdue = s => (s.installments || []).filter(i => !i.received && (i.due_date || "") < T).reduce((a,i) => a + N(i.value), 0);
function brokersOf(s){
  const b = (s.brokers && s.brokers.length) ? s.brokers : [{name: s.broker_name || "—", split_pct: 100, owner_id: s.owner_id}];
  const tot = b.reduce((a,x) => a + N(x.split_pct), 0) || 100;
  return b.map(x => ({name: (x.name || "—").trim(), owner_id: x.owner_id, share: N(x.split_pct) / tot}));
}
function commStatus(s){
  const cv = N(s.commission_value), rec = commReceived(s);
  if (cv <= 0) return s.commission_received ? ["Recebida","p-ok"] : ["Sem comissão","p-mut"];
  if (rec >= cv - 0.009) return ["Recebida","p-ok"];
  if (commOverdue(s) > 0) return ["Vencida","p-bad"];
  if (rec > 0) return ["Parcial","p-warn"];
  return ["A receber","p-gold"];
}
function computeStats(list){
  const r = {vgv:0, comm:0, corr:0, imob:0, entrada:0, rec:0, pend:0, venc:0, qtd:list.length};
  for (const s of list){ r.vgv += N(s.sale_value); r.comm += N(s.commission_value); r.corr += brokerComm(s); r.imob += agencyComm(s); r.entrada += N(s.entrada); r.rec += commReceived(s); r.pend += commPending(s); r.venc += commOverdue(s); }
  r.ticket = r.qtd ? r.vgv / r.qtd : 0; return r;
}
function optOutNames(){ const o = new Set(); for (const u of st.usuarios.values()) if (u.ranking_opt_out) [u.war_name, u.name].forEach(k => k && o.add(norm(k))); return o; }
function groupIndex(){ const idx = new Map(); for (const g of st.duplas.values()) if (!g.deleted_at) for (const m of g.members || []) idx.set(norm(m), g); return idx; }
function photoFor(name){
  const k = norm(name);
  for (const u of st.usuarios.values()) if (u.picture && String(u.picture).startsWith("data:") && [u.war_name,u.name].some(x => norm(x) === k)) return u.picture;
  for (const b of st.corretores.values()) if (b.photo && String(b.photo).startsWith("data:") && [b.war_name,b.full_name].some(x => norm(x) === k)) return b.photo;
  return null;
}
function ranking(list, kind){
  const opt = optOutNames(), gi = groupIndex(), map = new Map();
  for (const s of list){
    const sv = N(s.sale_value), cv = N(s.commission_value), pool = brokerComm(s);
    for (const b of brokersOf(s)){
      const k = norm(b.name); if (!k || opt.has(k)) continue;
      let key, label, members = [];
      if (kind === "duplas"){ const g = gi.get(k); if (!g) continue; key = "g:" + g.id; label = g.name || "Dupla"; members = g.members || []; }
      else { key = k; label = b.name; }
      const e = map.get(key) || {key, label, members, qtd:0, vgv:0, comm:0, corr:0, names:new Set()};
      e.qtd += b.share; e.vgv += sv * b.share; e.comm += cv * b.share; e.corr += pool * b.share; e.names.add(b.name);
      map.set(key, e);
    }
  }
  const by = ui.rankBy === "vgv" ? "vgv" : ui.rankBy === "comm" ? "comm" : "qtd";
  return [...map.values()].sort((a,b) => b[by] - a[by] || b.vgv - a.vgv);
}
const allSales = () => [...st.vendas.values()];
const periodSales = () => allSales().filter(s => isActive(s) && inPeriod(s, ui.month, ui.year));
const periodLabel = () => ui.month ? `${MESES[ui.month-1]} de ${ui.year}` : `Ano de ${ui.year}`;
function knownBrokers(){
  const set = new Map();
  for (const u of st.usuarios.values()) if (u.role === "corretor" && u.active !== false){ const n = (u.war_name || u.name || "").trim(); if (n) set.set(norm(n), n); }
  for (const b of st.corretores.values()){ const n = (b.war_name || b.full_name || "").trim(); if (n) set.set(norm(n), n); }
  for (const s of st.vendas.values()) for (const b of brokersOf(s)) if (b.name && b.name !== "—" && !set.has(norm(b.name))) set.set(norm(b.name), b.name);
  return [...set.values()].sort((a,b) => a.localeCompare(b, "pt-BR"));
}
function knownLots(){
  const set = new Map();
  for (const l of st.loteamentos.values()) set.set(norm(l.name), l.name);
  for (const s of st.vendas.values()) if (s.property_name && !set.has(norm(s.property_name))) set.set(norm(s.property_name), s.property_name.trim());
  return [...set.values()].sort((a,b) => a.localeCompare(b, "pt-BR"));
}
function resolveUser(name){ const k = norm(name); for (const u of st.usuarios.values()) if (u.role === "corretor" && [u.war_name,u.name].some(x => norm(x) === k)) return u; return null; }

/* ============ Banco (db capability) ============ */
async function loadAll(col){
  const out = []; let last = "";
  for (;;){
    const snap = await db.collection(col).where("id", ">", last).orderBy("id").limit(500).get();
    snap.docs.forEach(d => out.push(d.data()));
    if (snap.size < 500) break;
    last = out[out.length - 1].id;
  }
  return out;
}
function liveSync(col, since){
  db.collection(col).where("updated_at", ">", since).limit(1000).onSnapshot(snap => {
    let changed = false;
    for (const ch of snap.docChanges()){ if (ch.type === "removed") continue; const d = ch.doc.data(); if (d && d.id){ st[col].set(d.id, d); changed = true; } }
    if (changed) refresh();
  }, err => console.warn("sync", col, err && err.code));
}
let wq = Promise.resolve();
function saveDoc(col, data){
  data = {...data, updated_at: nowISO()};
  st[col].set(data.id, data); refresh(); if (typeof schedulePortals === "function") schedulePortals();
  wq = wq.then(() => db.doc(col + "/" + data.id).set(data)).catch(e => { console.error(e); toast(e && e.code === "quota_exceeded" ? "Limite de armazenamento atingido." : "Não foi possível salvar. Verifique sua conexão e tente de novo."); });
  return wq;
}

function drawChart(){
  const metric = ui.chMetric || "vgv", y = ui.year;
  const months = Array.from({length:12}, (_,i) => ({m:i+1, vgv:0, qtd:0}));
  for (const s of allSales()) if (isActive(s) && inPeriod(s, 0, y)){ const m = +(s.sale_date||"").slice(5,7); if (m){ months[m-1].vgv += N(s.sale_value); months[m-1].qtd++; } }
  $("#chTitle").textContent = (metric === "vgv" ? "VGV por mês" : "Vendas por mês") + " · " + y;
  const W = 720, H = 260, pl = 54, pr = 8, pt = 14, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const maxV = Math.max(1, ...months.map(o => o[metric]));
  const step = niceStep(maxV / 4), top = Math.ceil(maxV / step) * step;
  const sc = v => pt + ih - v / top * ih, bw = iw / 12, barW = Math.min(34, bw - 10);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step){ const yy = sc(v); g += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${metric==="vgv" ? shortBRL(v) : v}</text>`; }
  let bars = "";
  months.forEach((o,i) => {
    const x = pl + i*bw + (bw - barW)/2, yy = sc(o[metric]), h = pt + ih - yy, hi = ui.month === o.m;
    const r = Math.min(4, h);
    const path = h > 0 ? `M${x},${pt+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+barW-r} Q${x+barW},${yy} ${x+barW},${yy+r} V${pt+ih} Z` : "";
    bars += `<g class="bar" data-i="${i}" style="cursor:pointer"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>${path ? `<path d="${path}" fill="${hi ? "var(--barhi)" : "var(--bar)"}" opacity="${ui.month && !hi ? .55 : 1}"/>` : ""}<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" style="${hi?"fill:var(--fg);font-weight:700":""}">${MES3[i]}</text></g>`;
  });
  $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc($("#chTitle").textContent)}">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--border)"/>${bars}</svg><div class="tip"></div>`;
  const tip = $("#chart .tip"), svg = $("#chart svg");
  $$("#chart .bar").forEach(el => {
    const o = months[+el.dataset.i];
    el.addEventListener("mouseenter", () => { const r = svg.getBoundingClientRect(), k = r.width / W; tip.innerHTML = `<b>${MESES[o.m-1]}</b> · ${o.qtd} ${o.qtd===1?"venda":"vendas"}<br>${brl(o.vgv)}`; tip.style.left = ((pl + (o.m-.5)*bw) * k) + "px"; tip.style.top = (sc(o[metric]) * k - 6) + "px"; tip.style.opacity = 1; });
    el.addEventListener("mouseleave", () => tip.style.opacity = 0);
    el.addEventListener("click", () => { ui.month = ui.month === o.m ? 0 : o.m; refresh(); });
  });
  const yt = months.reduce((a,o) => ({vgv:a.vgv+o.vgv, qtd:a.qtd+o.qtd}), {vgv:0,qtd:0});
  $("#yearTot").innerHTML = `<span>Ano de ${y}: <b class="num">${brl(yt.vgv)}</b> em <b>${yt.qtd}</b> vendas</span><span>Clique num mês para filtrar</span>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function shortBRL(v){ if (v >= 1e6) return "R$ " + (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi"; if (v >= 1e3) return "R$ " + (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil"; return "R$ " + v; }

/* ============ Tabela de vendas ============ */
function salesTable(list, compact, sel){
  if (!list.length) return `<div class="empty"><b>Nenhuma venda encontrada</b>Ajuste os filtros ou cadastre uma nova venda.</div>`;
  const sold = soldTwiceIndex();
  return `<table><thead><tr>${sel ? `<th><input type="checkbox" class="chk" data-selall aria-label="Selecionar todas"></th>` : ""}<th>Data</th><th>Loteamento</th><th>Cliente</th><th>Corretor(es)</th><th class="r">Valor</th><th class="r">Comissão</th>${compact?"":`<th class="r hide-sm">Corretor / Imob.</th>`}<th>Status</th></tr></thead><tbody>${
    list.map(s => { const [lbl, cls] = isDeleted(s) ? ["Excluída","p-mut"] : isCancelled(s) ? ["Cancelada","p-bad"] : commStatus(s);
      const ql = [s.quadra && "Q " + s.quadra, s.lote && "L " + s.lote].filter(Boolean).join(" · ");
      const dup = sold.has(s.id) ? ` <span class="pill p-warn" title="Este lote aparece em mais de uma venda ativa">lote repetido</span>` : "";
      return `<tr data-id="${esc(s.id)}">${sel ? `<td><input type="checkbox" class="chk" data-sel="${esc(s.id)}" ${sel.has(s.id)?"checked":""} aria-label="Selecionar"></td>` : ""}<td class="num">${dBR(s.sale_date)}</td><td><b>${esc(s.property_name)}</b><span class="s">${esc(ql) || "—"}${dup}</span></td><td>${esc(s.client_name) || "—"}</td><td>${esc(brokersOf(s).map(b => b.name).join(" + "))}</td><td class="r num">${brl(s.sale_value)}</td><td class="r num">${brl(s.commission_value)}</td>${compact?"":`<td class="r num hide-sm">${brl(brokerComm(s))}<span class="s">${brl(agencyComm(s))}</span></td>`}<td><span class="pill ${cls}">${lbl}</span></td></tr>`; }).join("")}</tbody></table>`;
}
function soldTwiceIndex(){
  const m = new Map(), out = new Set();
  for (const s of st.vendas.values()){ if (!isActive(s) || !String(s.quadra||"").trim() || !String(s.lote||"").trim()) continue; const k = norm(s.property_name) + "|" + norm(s.quadra).replace(/^0+/,"") + "|" + norm(s.lote).replace(/^0+/,""); if (!m.has(k)) m.set(k, []); m.get(k).push(s.id); }
  for (const ids of m.values()) if (ids.length > 1) ids.forEach(i => out.add(i));
  return out;
}
function bindRows(root){ root.onclick = e => { const tr = e.target.closest("tr[data-id]"); if (tr) openSale(tr.dataset.id); }; }

const Vendas = {

      if (ui.selMode && e.target.closest("td")) { const tr = e.target.closest("tr[data-id]"); if (tr){ const id = tr.dataset.id; ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); Vendas.update(); } return; }
      const tr = e.target.closest("tr[data-id]"); if (tr) openSale(tr.dataset.id); };
    $("#vBulk").onclick = e => { const b = e.target.closest("[data-bulk]"); if (!b) return; const list = [...ui.sel].map(id => st.vendas.get(id)).filter(Boolean);
      if (b.dataset.bulk === "clear"){ ui.sel = new Set(); return Vendas.update(); }

  filtered(){
    const q = norm(ui.q), qd = q.replace(/\D/g, "");

      if (ui.fStatus === "ativas" && !isActive(s)) return false;
      if (ui.fStatus === "canceladas" && !(isCancelled(s) && !isDeleted(s))) return false;
      if (ui.fStatus === "excluidas" && !isDeleted(s)) return false;
      if (ui.fStatus !== "excluidas" && ui.fStatus !== "todas" && isDeleted(s)) return false;

        if (!hay.includes(q) && !(qd.length >= 3 && dig.includes(qd))) return false; }
      return true;
    }).sort((a,b) => ui.sort === "value" ? N(b.sale_value) - N(a.sale_value) : ui.sort === "comm" ? N(b.commission_value) - N(a.commission_value) : (b.sale_date||"").localeCompare(a.sale_date||"") || (b.created_at||"").localeCompare(a.created_at||""));

  },
};

/* ============ Financeiro (parcelas e divisão) ============ */
const Financeiro = {
  html: () => `
    <div class="pagehead"><div><h1>Financeiro</h1><p>Parcelas de comissão, recebimentos e divisão corretor / imobiliária</p></div></div>
    <section class="kpis" id="fK"></section>
    <section class="card"><div class="hd"><h2>Comissões a receber</h2>
      <div class="seg" id="finF"><button data-f="vencidas">Vencidas</button><button data-f="30">Próximos 30 dias</button><button data-f="todas">Todas em aberto</button><button data-f="recebidas">Recebidas no período</button></div></div>
      <div class="tablewrap" id="fList" style="margin-top:12px"></div></section>
    <section class="card"><div class="hd"><h2>Divisão por corretor</h2><span class="eyebrow" id="fdLabel"></span></div><div class="tablewrap" id="fDiv" style="margin-top:12px"></div></section>`,
  bind(){
    $("#finF").onclick = e => { const b = e.target.closest("button"); if (!b) return; ui.finFilter = b.dataset.f; Financeiro.update(); };
    $("#fList").onclick = async e => {
      const b = e.target.closest("[data-recv]"); if (b){ e.stopPropagation(); const [id, n] = b.dataset.recv.split("|"); await toggleReceived(id, +n); return; }
      const tr = e.target.closest("tr[data-id]"); if (tr) openSale(tr.dataset.id);
    };
  },
  rows(){
    const out = [], lim = addMonths(T, 1);
    for (const s of allSales()){ if (!isActive(s)) continue;
      const its = s.installments || [];
      if (its.length) its.forEach(i => out.push({s, n:i.number, due:i.due_date || s.sale_date, value:N(i.value), received:!!i.received, rdate:i.received_date, label:`Parcela ${i.number}/${its.length}` + (!i.received && instPaid(i) > 0 ? ` · parcial ${brl(instPaid(i))}` : "")}));
      else if (N(s.commission_value) > 0) out.push({s, n:0, due:s.sale_date, value:N(s.commission_value), received:!!s.commission_received, rdate:(s.commission_received_at||"").slice(0,10), label:"Comissão à vista"});
    }
    const f = ui.finFilter;
    return out.filter(r => f === "recebidas" ? r.received && inPeriod({sale_date: r.rdate || r.due}, ui.month, ui.year)
      : !r.received && (f === "todas" || (f === "vencidas" ? r.due < T : r.due >= T && r.due <= lim)))
      .sort((a,b) => f === "recebidas" ? (b.rdate||"").localeCompare(a.rdate||"") : (a.due||"").localeCompare(b.due||""));
  },
  update(){
    const all = allSales().filter(isActive), open = all.reduce((a,s) => a + commPending(s), 0), venc = all.reduce((a,s) => a + commOverdue(s), 0);
    const per = computeStats(periodSales());
    $("#fK").innerHTML = [["Em aberto (total)", open, "var(--warn)"], ["Parcelas vencidas", venc, "var(--bad)"], ["Recebido · " + (ui.month ? MES3[ui.month-1] + "/" + ui.year : ui.year), per.rec, "var(--ok)"], ["Imobiliária · período", per.imob, "var(--gold)"]]
      .map(([l,v,c]) => `<div class="card kpi" style="--c:${c}"><span class="lbl"><i class="dot"></i>${l}</span><span class="val num">${brl(v)}</span></div>`).join("");
    $$("#finF button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === ui.finFilter));
    const rows = Financeiro.rows();
    $("#fList").innerHTML = rows.length ? `<table><thead><tr><th>Vencimento</th><th>Venda</th><th>Corretor(es)</th><th>Parcela</th><th class="r">Valor</th><th></th></tr></thead><tbody>${rows.slice(0,300).map(r => `
      <tr data-id="${esc(r.s.id)}"><td class="num">${dBR(r.due)}${!r.received && r.due < T ? ` <span class="pill p-bad">vencida</span>` : ""}</td><td><b>${esc(r.s.property_name)}</b><span class="s">${esc(r.s.client_name)||"—"} · Q ${esc(r.s.quadra)||"–"} L ${esc(r.s.lote)||"–"}</span></td><td>${esc(brokersOf(r.s).map(b=>b.name).join(" + "))}</td><td>${r.label}${r.received ? `<span class="s">recebida ${dBR(r.rdate)}</span>` : ""}</td><td class="r num">${brl(r.value)}</td>
      <td class="r">${canWrite ? `<button class="btn sm ${r.received?"":"pri"}" data-recv="${esc(r.s.id)}|${r.n}">${r.received ? "Desfazer" : "Recebida"}</button>` : ""}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty"><b>Nada aqui</b>${ui.finFilter === "vencidas" ? "Nenhuma comissão vencida. Tudo em dia." : "Nenhum lançamento para este filtro."}</div>`;
    $("#fdLabel").textContent = periodLabel();
    const m = new Map();
    for (const s of periodSales()){ const pool = brokerComm(s), ag = agencyComm(s), rf = N(s.commission_value) > 0 ? Math.min(commReceived(s)/N(s.commission_value),1) : 0;
      for (const b of brokersOf(s)){ const k = norm(b.name); const e = m.get(k) || {name:b.name, q:0, vgv:0, comm:0, corr:0, imob:0, rec:0}; e.q += b.share; e.vgv += N(s.sale_value)*b.share; e.comm += N(s.commission_value)*b.share; e.corr += pool*b.share; e.imob += ag*b.share; e.rec += pool*b.share*rf; m.set(k,e); } }
    const L = [...m.values()].sort((a,b) => b.corr - a.corr), tt = L.reduce((a,e) => {for (const k of ["q","vgv","comm","corr","imob","rec"]) a[k]+=e[k]; return a;}, {q:0,vgv:0,comm:0,corr:0,imob:0,rec:0});
    $("#fDiv").innerHTML = L.length ? `<table><thead><tr><th>Corretor</th><th class="r">Vendas</th><th class="r">VGV</th><th class="r">Comissão</th><th class="r">Corretor</th><th class="r">Já recebido</th><th class="r">Imobiliária</th></tr></thead><tbody>${L.map(e => `<tr style="cursor:default"><td><b>${esc(e.name)}</b></td><td class="r num">${fmtQ(e.q)}</td><td class="r num">${brl(e.vgv)}</td><td class="r num">${brl(e.comm)}</td><td class="r num">${brl(e.corr)}</td><td class="r num">${brl(e.rec)}</td><td class="r num">${brl(e.imob)}</td></tr>`).join("")}
      <tr style="cursor:default;font-weight:700"><td>Total</td><td class="r num">${fmtQ(tt.q)}</td><td class="r num">${brl(tt.vgv)}</td><td class="r num">${brl(tt.comm)}</td><td class="r num">${brl(tt.corr)}</td><td class="r num">${brl(tt.rec)}</td><td class="r num">${brl(tt.imob)}</td></tr></tbody></table>` : `<div class="empty">Nenhuma venda neste período.</div>`;
  },
};
async function toggleReceived(id, n){
  const s = structuredClone(st.vendas.get(id)); if (!s) return;
  let msg;
  if (!n || !(s.installments||[]).length){ s.commission_received = !s.commission_received; s.commission_received_at = s.commission_received ? nowISO() : null; msg = s.commission_received ? "Comissão marcada como recebida" : "Recebimento desfeito"; }
  else { const it = s.installments.find(i => i.number === n); if (!it) return; it.received = !it.received; it.received_date = it.received ? T : null; if (it.received && !(it.payments||[]).length && it.status) it.status = "pago"; else if (!it.received && it.status) it.status = (it.due_date||"") < T ? "vencida" : "pendente"; msg = it.received ? `Parcela ${n} recebida` : `Parcela ${n} reaberta`; }
  saveDoc("vendas", s); audit("baixa", s, msg); toast(msg);
  if ($("#sheet").open) openSale(id);
}

  const tt = $("#instTot"); if (tt) tt.innerHTML = `Total das parcelas: <b class="num">${brl(it)}</b>${Math.abs(it - cv) > 0.05 && F.installments.length ? ` <span class="pill p-warn">difere da comissão</span>` : ""}`;

function submitSale(editing){
  const err = [];

    owner_id: resolved[0].owner_id, owner_name: resolved[0].name,
    commission_gross: cv, commission_value: cv, commission_net: +(cv - disc).toFixed(2), discounts: F.discounts.filter(d => N(d.value)),
    broker_commission: +(cv * N(F.broker_split) / 100).toFixed(2), agency_commission: +(cv - cv * N(F.broker_split) / 100).toFixed(2),
    installments: F.parcelado ? F.installments : [], commission_received: F.parcelado ? false : !!F.commission_received,
  });
  if (!editing){ s.id = rid("sale"); s.created_at = nowISO(); s.user_id = "owner"; }

async function fileToDataURL(file, max = 200){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");

function clientIndex(){
  const map = new Map();
  const blank = (k, nm) => ({key:k, name:nm, phone:"", email:"", cpf:"", birthdate:"", purchases:[], qtd:0, vgv:0, last:"", reg:null, variants:new Set()});
  for (const s of allSales()){
    if (isDeleted(s)) continue; const nm = (s.client_name || "").trim(); if (!nm) continue;
    const k = norm(nm), c = map.get(k) || blank(k, nm); c.variants.add(nm);
    for (const [f, sf] of [["phone","client_phone"],["email","client_email"],["cpf","client_cpf"],["birthdate","client_birthdate"]]) if (!c[f] && s[sf]) c[f] = s[sf];
    c.purchases.push(s); if (isActive(s)){ c.qtd++; c.vgv += N(s.sale_value); } if ((s.sale_date || "") > c.last) c.last = s.sale_date;
    map.set(k, c);
  }
  for (const r of st.clientes.values()){
    if (r.deleted_at) continue; const k = norm(r.name); if (!k) continue;
    const c = map.get(k) || blank(k, r.name); c.reg = r; c.name = r.name || c.name;
    for (const f of ["phone","email","cpf","birthdate"]) if (r[f]) c[f] = r[f];
    map.set(k, c);
  }
  const out = [...map.values()];
  for (const c of out){ c.purchases.sort((a,b) => (b.sale_date||"").localeCompare(a.sale_date||"")); c.broker = c.purchases[0] ? brokersOf(c.purchases[0]).map(b => b.name).join(" + ") : ""; }
  return out.sort((a,b) => a.name.localeCompare(b.name, "pt-BR"));
}
function clientDuplicates(list){

  for (const c of list){ const cpf = onlyDigits(c.cpf); if (cpf.length === 11){ if (!by.has(cpf)) by.set(cpf, []); by.get(cpf).push(c); } }
  return [...by.entries()].filter(([,a]) => a.length > 1).map(([cpf, a]) => ({cpf, items:a}));
}

function shareFor(s, person){

  const bs = s.brokers || [];
  if (!bs.length) return (s.owner_id === uid || names.has(norm(s.broker_name))) ? 1 : 0;
  const tot = bs.reduce((a,b) => a + N(b.split_pct), 0) || 100;
  return bs.filter(b => b.owner_id === uid || names.has(norm(b.name))).reduce((a,b) => a + N(b.split_pct), 0) / tot;

    <div class="pagehead"><div><h1>Agenda</h1><p>Visitas, plantões e retornos da equipe</p></div><div class="toolbar"><div class="seg" id="agF"><button data-f="prox">Próximos</button><button data-f="atras">Atrasados</button><button data-f="feitos">Concluídos</button></div><button class="btn pri" id="agNew">+ Compromisso</button></div></div>
    <section class="card"><div class="bd toolbar"><label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="agAuto"> Mostrar também vencimentos de parcelas e aniversários</label></div><div id="agList" style="padding:0 16px 16px"></div></section>`,
  bind(){
    ui.agF = ui.agF || "prox"; $("#agAuto").checked = !!ui.agAuto;
    $("#agF").onclick = e => { const b = e.target.closest("button"); if (!b) return; ui.agF = b.dataset.f; Agenda.update(); };
    $("#agAuto").onchange = e => { ui.agAuto = e.target.checked; Agenda.update(); };
    $("#agNew").onclick = () => openApptForm(null); $("#agNew").hidden = !canWrite;
    $("#agList").onclick = e => {
      const d = e.target.closest("[data-done]"); if (d){ const a = st.agenda.get(d.dataset.done); if (a){ saveDoc("agenda", {...a, done: !a.done, done_at: a.done ? null : nowISO()}); toast(a.done ? "Reaberto" : "Concluído"); } return; }
      const ed = e.target.closest("[data-ea]"); if (ed) return openApptForm(st.agenda.get(ed.dataset.ea));
      const s = e.target.closest("[data-sale]"); if (s) return openSale(s.dataset.sale);

  },
  update(){
    $$("#agF button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === ui.agF));
    const now = T, lim = addMonths(T, 2);
    let L = agendaItems();
    if (ui.agF === "prox") L = L.filter(i => !i.done && i.date >= now && (i.kind === "appt" || i.date <= lim)).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    else if (ui.agF === "atras") L = L.filter(i => !i.done && i.date < now && i.kind !== "aniv").sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
    else L = L.filter(i => i.done).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
    const days = new Map(); for (const i of L.slice(0, 250)){ if (!days.has(i.date)) days.set(i.date, []); days.get(i.date).push(i); }
    const wd = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"long", timeZone:"UTC"}); };

        <span class="num" style="color:var(--mfg)">${esc(i.time) || "—"}</span>
        <div style="min-width:0"><b style="${i.done?"text-decoration:line-through;color:var(--mfg)":""}">${esc(i.title)}</b><span class="s" style="display:block;color:var(--mfg);font-size:12px">${esc(i.sub)}${i.notes ? " · " + esc(i.notes) : ""}</span></div>
        <span>${i.kind==="appt" && canWrite ? `<button class="btn sm" data-ea="${esc(i.id)}">Editar</button>` : i.kind==="parc" ? `<button class="btn sm" data-sale="${esc(i.id)}">Ver venda</button>` : i.kind==="aniv" ? '<span class="pill p-gold">aniversário</span>' : ""}</span></div>`).join("")}</div>`).join("")
      : `<div class="empty"><b>${ui.agF === "prox" ? "Nenhum compromisso pela frente" : ui.agF === "atras" ? "Nada atrasado" : "Nenhum compromisso concluído"}</b>${ui.agF === "prox" ? "Use “+ Compromisso” para agendar visitas, plantões e retornos." : ""}</div>`;
  },
};

const lotList = () => [...st.loteamentos.values()].filter(l => !l.deleted_at).sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, "pt-BR"));
const lotMedia = (id, kind) => [...st.lot_media.values()].filter(m => m.lot_id === id && !m.deleted_at && (!kind || (Array.isArray(kind) ? kind.includes(m.kind) : m.kind === kind))).sort((a,b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.created_at||"").localeCompare(b.created_at||""));
const lotSales = l => allSales().filter(s => isActive(s) && norm(s.property_name) === norm(l.name));
function lotCoords(l){ if (l.lat && l.lng) return [+l.lat, +l.lng]; const m = String((l.specs||{}).localizacao?.coords || "").match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/); return m ? [+m[1], +m[2]] : null; }
function lotCompleteness(l){ const s = l.specs || {}; let f = 0, t = 0; for (const sec of ["tecnicos","obra","localizacao","comercial"]) for (const [k] of SPEC[sec][1]){ t++; if (String((s[sec]||{})[k] || "").trim()) f++; } return Math.round(f / t * 100); }
const gmaps = c => `https://www.google.com/maps/search/?api=1&query=${c[0]},${c[1]}`;

const Loteamentos = {

    <div class="pagehead"><div><h1>Loteamentos</h1><p id="lLabel"></p></div><div class="toolbar"><div class="seg" id="lMode"><button data-m="lista">Lista</button><button data-m="mapa">Mapa geral</button>${canWrite ? `<button data-m="dup">Duplicados</button><button data-m="ordem">Organizar</button>` : ""}</div><button class="btn pri" id="lNew">+ Loteamento</button></div></div>

    $("#lBox").innerHTML = L.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">${L.map(l => {
      const s = l.specs || {}, loc = s.localizacao || {}, com = s.comercial || {}, ob = s.obra || {}, cover = lotMedia(l.id, ["foto","planta"])[0], n = lotSales(l).length, pc = lotCompleteness(l);
      return `<button class="card" data-lot="${esc(l.id)}" style="text-align:left;padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column">

          <span style="color:var(--mfg);font-size:12px">${n} ${n===1?"venda":"vendas"} · ficha ${pc}% preenchida${l.phase && l.phase !== "em_vendas" ? ` · <b style="color:${l.phase === "lancamento" ? "var(--gold)" : "var(--ok)"}">${PHASES[l.phase]}</b>` : ""}</span></div></button>`; }).join("")}</div>`

function mapSVG(L, focus){
  let pts = L.map(l => ({l, c: lotCoords(l)})).filter(p => p.c), far = [];
  if (pts.length > 4){ const med = a => { const s = [...a].sort((x,y) => x-y); return s[Math.floor(s.length/2)]; }; const cy = med(pts.map(p => p.c[0])), cx = med(pts.map(p => p.c[1]));
    const d = p => Math.hypot(p.c[0]-cy, p.c[1]-cx), md = Math.max(.05, med(pts.map(d)));
    far = pts.filter(p => d(p) > md * 5 && (!focus || p.l.id !== focus)); pts = pts.filter(p => !far.includes(p)); }
  if (!pts.length) return `<div class="empty"><b>Sem coordenadas</b>Preencha “Coordenadas (lat, lng)” nos dados de localização.</div>`;
  let [la0, la1, lo0, lo1] = [Math.min(...pts.map(p => p.c[0])), Math.max(...pts.map(p => p.c[0])), Math.min(...pts.map(p => p.c[1])), Math.max(...pts.map(p => p.c[1]))];
  const pad = Math.max(.02, (la1-la0)*.12, (lo1-lo0)*.12); la0 -= pad; la1 += pad; lo0 -= pad; lo1 += pad;
  const W = 900, H = Math.max(320, Math.min(620, W * (la1-la0)/(lo1-lo0))), X = lo => (lo-lo0)/(lo1-lo0)*W, Y = la => (la1-la)/(la1-la0)*H;
  const km = 111 * (lo1-lo0) * Math.cos((la0+la1)/2*Math.PI/180), sc = [1,2,5,10,20,50,100].find(v => v >= km/6) || 100, scW = sc/km*W;
  let grid = ""; for (let i = 1; i < 6; i++){ grid += `<line x1="${W*i/6}" x2="${W*i/6}" y1="0" y2="${H}" stroke="var(--grid)"/><line y1="${H*i/6}" y2="${H*i/6}" x1="0" x2="${W}" stroke="var(--grid)"/>`; }
  const placed = [], ord = [...pts].sort((a,b) => (b.l.id === focus) - (a.l.id === focus));
  const dots = ord.map(p => { const f = focus && p.l.id === focus, x = X(p.c[1]), y = Y(p.c[0]), w = p.l.name.length * (f ? 7.6 : 6.4) + 12, box = [x+8, y-9, x+8+w, y+6];
    const ok = !placed.some(q => !(box[2] < q[0] || box[0] > q[2] || box[3] < q[1] || box[1] > q[3])); if (ok) placed.push(box);
    return `<g data-lot="${esc(p.l.id)}" style="cursor:pointer"><title>${esc(p.l.name)}</title><circle cx="${x}" cy="${y}" r="${f?9:6}" fill="${f?"var(--barhi)":"var(--bar)"}" stroke="var(--card)" stroke-width="2"/>${ok ? `<text x="${x+10}" y="${y+4}" style="font-size:${f?13:11}px;fill:var(--fg);font-weight:${f?700:500};paint-order:stroke;stroke:var(--card);stroke-width:3px">${esc(p.l.name)}</text>` : ""}</g>`; }).reverse().join("");
  return `<div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--muted)"><svg viewBox="-10 -10 ${W+180} ${H+40}" style="display:block;width:100%;min-width:560px;height:auto" role="img" aria-label="Mapa dos loteamentos">${grid}${dots}
    <g transform="translate(10 ${H+16})"><line x1="0" x2="${scW}" y1="0" y2="0" stroke="var(--fg)" stroke-width="2"/><text x="${scW+6}" y="4" style="font-size:11px;fill:var(--mfg)">${sc} km</text></g><text x="${W+150}" y="14" text-anchor="end" style="font-size:12px;fill:var(--mfg)">N ↑</text></svg></div>
    <div class="toolbar" style="margin-top:8px;font-size:12px;color:var(--mfg)">${pts.length > placed.length ? `<span>Pontos sem nome estão muito próximos: passe o mouse ou toque para ver.</span>` : ""}${far.length ? `<span>Mais distantes (fora deste recorte):</span>${far.map(p => `<button class="btn sm" data-lot="${esc(p.l.id)}">${esc(p.l.name)}</button>`).join("")}` : ""}</div>`;
}

let LT = {id: null, tab: "dados", edit: false};
const LTABS = [["dados","Dados técnicos"],["midia","Fotos & vídeos"],["docs","Documentos"],["mapa","Mapa"],["arte","Arte"],["copys","Copys"],["ia","Assistente IA"]];

  const sh = $("#sheet"); sh.classList.add("wide");
  renderLot(); if (!sh.open) sh.showModal();
  sh.addEventListener("close", () => sh.classList.remove("wide"), {once: true});

function renderLot(){
  const l = st.loteamentos.get(LT.id); if (!l) return;
  const html = `<div class="dlg"><div class="dh"><div style="flex:1;min-width:0"><h2>${esc(l.name)}</h2><p>${esc([((l.specs||{}).localizacao||{}).cidade, ((l.specs||{}).localizacao||{}).estado].filter(Boolean).join(" · ")) || "Loteamento"}</p></div><button class="btn icon" data-x aria-label="Fechar">✕</button></div>
    <nav class="tabs" style="padding:0 18px;border-bottom:1px solid var(--border)">${LTABS.map(([k,t]) => `<button data-lt="${k}" aria-selected="${LT.tab===k}">${t}</button>`).join("")}</nav>

function lotClick(e, l){

/* ---- Avisos (notificações) ---- */
function aviso(type, message, to = "all", meta = {}){

  wq = wq.then(async () => { const d = await ref.get(); const itens = d.exists ? [...(d.data().itens || [])] : []; itens.push(item); await ref.set({id: ym, itens: itens.slice(-1500), updated_at: nowISO()}); }).catch(e => console.warn("aviso", e));
  updateBell();
}
function avisosFor(uid, owner){
  const out = [];
  for (const d of st.avisos.values()) for (const n of d.itens || []) if (n.to === "all" || n.to === uid || (owner && n.to === "gestor")) out.push(n);
  const hist = owner ? MASTER_IDS() : [uid];
  for (const h of hist){ const d = st.notificacoes.get(h); if (d) for (const n of d.itens || []) out.push({id: n.id, type: n.type, message: n.message, meta: n.meta, at: n.created_at, hist: true}); }
  const seen = new Set(); return out.filter(n => !seen.has(n.message + (n.at||"").slice(0,16)) && seen.add(n.message + (n.at||"").slice(0,16))).sort((a,b) => (b.at||"").localeCompare(a.at||""));
}

const libPDFJS = async () => { if (window.pdfjsLib) return; await loadScript(["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"]); try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch {} };
async function fileForAI(file, maxImgs){
  const name = (file.name || "").toLowerCase(), type = file.type || "";
  if (type.startsWith("image/")) return {text: "", images: [file], kind: "imagem"};
  if (/\.csv$/.test(name) || type === "text/csv"){ const t = await file.text(); return {text: t.slice(0, 200000), images: [], kind: "planilha", cut: t.length > 200000}; }
  if (/\.(xlsx|xls|ods)$/.test(name) || /sheet|excel/.test(type)){
    await libXLSX(); const wb = XLSX.read(await file.arrayBuffer(), {type: "array", cellDates: true});
    const text = wb.SheetNames.map(n => `### Aba: ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], {FS: ";", dateNF: "dd/mm/yyyy"})).join("\n\n");
    return {text: text.slice(0, 200000), images: [], kind: "planilha", cut: text.length > 200000};
  }
  if (type === "application/pdf" || name.endsWith(".pdf")){
    await libPDFJS(); const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
    let text = ""; for (let i = 1; i <= Math.min(pdf.numPages, 80); i++){ const pg = await pdf.getPage(i); const c = await pg.getTextContent(); text += `\n--- página ${i} ---\n` + c.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join(""); }
    if (text.replace(/\s|---|página \d+/g, "").length > 150) return {text: text.slice(0, 200000), images: [], kind: "pdf", cut: text.length > 200000};
    const imgs = []; for (let i = 1; i <= Math.min(pdf.numPages, maxImgs || 4); i++){ const pg = await pdf.getPage(i), vp = pg.getViewport({scale: 1.6}), cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise; imgs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", .85))); }
    return {text: "", images: imgs, kind: "pdf escaneado"};
  }

}
async function aiFromFile(file, prompt, opts = {}){

  if (f.images.length && !lim.images) throw {code: "images_unavailable"};
  const input = prompt + (f.text ? `\n\nCONTEÚDO DO ARQUIVO (${f.kind}, ${file.name}):\n"""\n${f.text}\n"""` : `\n\nO conteúdo está ${f.images.length > 1 ? "nas imagens anexas (páginas do arquivo)" : "na imagem anexa"} (${file.name}).`);
  const out = await ai.json(input, {...opts, images: f.images.length ? f.images.slice(0, lim.images ? lim.images.maxCount : 1) : undefined, modelTier: opts.modelTier || "default"});
  return {data: out, cut: f.cut, text: f.text || ""};
}

function lotText(l){

  for (const sec of ["tecnicos","obra","localizacao","comercial"]){ const r = SPEC[sec][1].map(([k,lab,ty,opt]) => { let v = ((s[sec]||{})[k] ?? ""); if (!String(v).trim()) return ""; if (opt) v = opt[v] || v; return `- ${lab}: ${v}`; }).filter(Boolean); if (r.length) lines.push(`\n${SPEC[sec][0].toUpperCase()}:`, ...r); }

  for (const b of (l.book||[]).slice(-3)) lines.push(`\nMATERIAL DO LOTEAMENTO (arquivo: ${b.titulo}):` + (b.resumo ? `\nRESUMO:\n${b.resumo}` : "") + (b.texto ? `\nTEXTO DO ARQUIVO:\n${b.texto}` : ""));

}

const SALE_JSON = `{"property_name": "nome do loteamento", "quadra": "", "lote": "", "client_name": "", "client_phone": "", "client_email": "", "client_cpf": "", "client_birthdate": "AAAA-MM-DD", "broker_name": "nome do corretor", "sale_date": "AAAA-MM-DD", "sale_value": 0, "entrada": 0, "commission_rate": 0, "commission_value": 0, "notes": ""}`;
function normAISale(x){
  const out = {}; for (const k of ["property_name","quadra","lote","client_name","client_phone","client_email","client_cpf","broker_name","notes"]) out[k] = String(x[k] ?? "").trim();
  const d = v => { v = String(v || "").trim(); let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0]; m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } return ""; };
  out.sale_date = d(x.sale_date); out.client_birthdate = d(x.client_birthdate);
  for (const k of ["sale_value","entrada","commission_rate","commission_value"]) out[k] = typeof x[k] === "number" ? x[k] : parseMoney(x[k]);
  const lot = knownLots().find(n => norm(n) === norm(out.property_name)); if (lot) out.property_name = lot;
  const br = knownBrokers().find(n => norm(n) === norm(out.broker_name)) || knownBrokers().find(n => out.broker_name && norm(n).split(" ")[0] === norm(out.broker_name).split(" ")[0] && norm(out.broker_name).length > 3); if (br) out.broker_name = br;
  return out;
}

/* ============ Etapa 6: baixa parcial, anexos, comemoração, duplicados e ordem de loteamentos ============ */
const PAYM = ["PIX","Transferência","Boleto","Dinheiro","Cheque","Outro"];
const instNet = i => N(i.net) || +(N(i.gross || i.value) - N(i.discount)).toFixed(2);
const instPaid = (i, kind = "repasse") => +(i.payments || []).filter(p => (p.kind || "repasse") === kind).reduce((a,p) => a + N(p.amount), 0).toFixed(2);
function recomputeInst(i){ const net = instNet(i), paid = instPaid(i); i.net = net; i.paid = paid;
  if (paid <= 0 && !(i.payments||[]).length) { i.status = i.received ? "pago" : (i.due_date || "") < T ? "vencida" : "pendente"; return; }
  i.status = paid <= 0 ? ((i.due_date||"") < T ? "vencida" : "pendente") : (net - paid > .009 ? "parcial" : "pago"); i.received = i.status === "pago"; i.received_date = i.received ? ((i.payments||[]).filter(p => (p.kind||"repasse") === "repasse").map(p => p.date).sort().pop() || T) : null; }
/* recebido passa a contar pagamentos parciais */
function commReceived(s){ const it = s.installments || []; if (it.length) return it.reduce((a,i) => a + (i.received ? N(i.value) : Math.min(i.paid != null ? N(i.paid) + N(i.discount) : instPaid(i), N(i.value))), 0); if (s.commission_received) return N(s.commission_value); return Math.min(+(s.payments||[]).filter(p => (p.kind||"repasse") === "repasse").reduce((a,p) => a + N(p.amount), 0), N(s.commission_value)); }

function openBaixa(s, n){
  const its = s.installments || [], it = n ? its.find(i => i.number === n) : null;
  const total = it ? instNet(it) : N(s.commission_value), pays = it ? (it.payments || []) : (s.payments || []), falta = Math.max(total - (it ? instPaid(it) : pays.filter(p => (p.kind||"repasse") === "repasse").reduce((a,p) => a + N(p.amount), 0)), 0);
  let receipt = null;
  modal(`<form class="dlg" novalidate style="max-width:560px"><div class="dh"><div style="flex:1"><h2>Dar baixa · ${it ? `parcela ${n}/${its.length}` : "comissão à vista"}</h2><p>${esc(s.property_name)} · Q ${esc(s.quadra)||"–"} L ${esc(s.lote)||"–"} · valor ${brl(total)} · falta ${brl(falta)}</p></div><button type="button" class="btn icon" data-x aria-label="Fechar">✕</button></div>
    <div class="db">${pays.length ? `<div class="fs"><h3>Pagamentos registrados</h3>${pays.map((p,k) => `<div class="inst" style="grid-template-columns:minmax(0,1fr) auto auto"><div><b>${brl(p.amount)}</b> · ${(p.kind||"repasse") === "repasse" ? "repasse ao corretor" : "recebido da construtora"}<span class="s" style="display:block;color:var(--mfg);font-size:12px">${dBR(p.date)} · ${esc(p.method || "s/ forma")}${N(p.discount) ? " · desconto " + brl(p.discount) : ""}${p.reason ? " · " + esc(p.reason) : ""}${p.by ? " · por " + esc(p.by) : ""}</span></div>${p.receipt_id ? `<a class="btn sm" href="/_blob/${esc(p.receipt_id)}" target="_blank" rel="noopener">Comprovante</a>` : "<span></span>"}<button type="button" class="btn sm danger" data-rmp="${k}">Remover</button></div>`).join("")}</div>` : ""}
      <div class="g"><label class="f">Tipo<select name="kind" id="bx_k"><option value="repasse">Repasse (p/ corretor)</option><option value="recebimento">Recebimento (da construtora)</option></select></label>
        <label class="f">Valor pago (R$) *<input type="text" inputmode="decimal" name="amount" id="bx_a" value="${falta ? falta.toLocaleString("pt-BR",{minimumFractionDigits:2}) : ""}"></label>
        <label class="f">Data do pagamento<input type="date" name="date" id="bx_d" value="${T}"></label>
        <label class="f">Forma<select name="method" id="bx_m">${PAYM.map(m => `<option>${m}</option>`).join("")}</select></label>
        <label class="f">Desconto (R$)<input type="text" inputmode="decimal" name="discount" id="bx_ds" placeholder="0,00"></label>
        <label class="f">Motivo do desconto<input type="text" name="reason" id="bx_r"></label></div>

    const amount = parseMoney(fv(fd, "amount")); if (!(amount > 0)) return $("#bxWarn").innerHTML = `<div class="alert e">Informe o valor pago.</div>`;
    const n2 = structuredClone(st.vendas.get(s.id)), pay = {amount, date: fv(fd,"date") || T, method: fv(fd,"method"), discount: parseMoney(fv(fd,"discount")), reason: fv(fd,"reason"), notes: fv(fd,"notes"), kind: fv(fd,"kind"), by: myName(), at: nowISO()};

    if (n){ const t = n2.installments.find(i => i.number === n); t.payments = [...(t.payments||[]), pay]; if (pay.discount) t.discount = +(N(t.discount) + pay.discount).toFixed(2); recomputeInst(t); }
    else { n2.payments = [...(n2.payments||[]), pay]; const paid = n2.payments.filter(p => (p.kind||"repasse") === "repasse").reduce((a,p) => a + N(p.amount) + N(p.discount), 0); if (paid >= N(n2.commission_value) - .009){ n2.commission_received = true; n2.commission_received_at = nowISO(); } }
    saveDoc("vendas", n2); audit("baixa", n2, `${n ? "Parcela " + n : "Comissão à vista"}: ${pay.kind} ${brl(amount)} (${pay.method || "s/ forma"})`); $("#dlg").close(); toast("Baixa registrada"); openSale(s.id);
  });
  const f = $("#bx_f"); if (f) f.onchange = e => { receipt = e.target.files[0] || null; $("#bxFile").textContent = receipt ? receipt.name : ""; };
  $("#dlg").addEventListener("click", e => { const r = e.target.closest("[data-rmp]"); if (!r) return; confirmBtn(r, "Confirmar", () => { const n2 = structuredClone(st.vendas.get(s.id)), k = +r.dataset.rmp;
    if (n){ const t = n2.installments.find(i => i.number === n); const p = t.payments.splice(k, 1)[0]; if (p && N(p.discount)) t.discount = Math.max(0, +(N(t.discount) - N(p.discount)).toFixed(2)); recomputeInst(t); } else { n2.payments.splice(k, 1); const paid = n2.payments.filter(p => (p.kind||"repasse") === "repasse").reduce((a,p) => a + N(p.amount) + N(p.discount), 0); if (paid < N(n2.commission_value) - .009){ n2.commission_received = false; n2.commission_received_at = null; } }
    saveDoc("vendas", n2); audit("baixa", n2, `Pagamento removido (${n ? "parcela " + n : "à vista"})`); $("#dlg").close(); toast("Pagamento removido"); openSale(s.id); }); });
}

/* ---- loteamentos: duplicados e ordem ---- */
const lotKey = n => norm(n).replace(/[^a-z0-9]/g, "");
function lotDuplicates(){
  const g = new Map();
  for (const l of lotList()){ const k = lotKey(l.name); if (!g.has(k)) g.set(k, {lots: [], names: new Map()}); g.get(k).lots.push(l); }
  for (const s of allSales()){ if (isDeleted(s) || !s.property_name) continue; const k = lotKey(s.property_name); if (!g.has(k)) g.set(k, {lots: [], names: new Map()}); const e = g.get(k); e.names.set(s.property_name.trim(), (e.names.get(s.property_name.trim()) || 0) + 1); }
  return [...g.entries()].map(([k, e]) => ({k, ...e})).filter(e => e.lots.length > 1 || (e.lots.length === 1 && [...e.names.keys()].some(n => n !== e.lots[0].name)) || (!e.lots.length && e.names.size > 1));
}
function mergeLots(k, offId){
  const grp = lotDuplicates().find(x => x.k === k); if (!grp) return;
  let off = grp.lots.find(l => l.id === offId);
  if (!off){ const nm = [...grp.names.entries()].sort((a,b) => b[1]-a[1])[0][0]; off = {id: rid("lot"), name: nm, name_lower: nm.toLowerCase(), created_at: nowISO(), specs: {}, copies: [], ai_training: ""}; }
  off = structuredClone(off);
  for (const l of grp.lots){ if (l.id === off.id) continue;
    for (const sec of ["tecnicos","obra","localizacao","comercial"]) for (const [kk, vv] of Object.entries((l.specs||{})[sec] || {})) if (String(vv||"").trim() && !String(((off.specs||{})[sec]||{})[kk]||"").trim()){ off.specs = off.specs || {}; off.specs[sec] = {...(off.specs[sec]||{}), [kk]: vv}; }
    const inf = new Set([...(((off.specs||{}).infraestrutura||{}).items||[]), ...(((l.specs||{}).infraestrutura||{}).items||[])]); off.specs.infraestrutura = {...((off.specs||{}).infraestrutura||{}), items: [...inf], outro: "", outros: [...new Set([...infraOutros((off.specs||{}).infraestrutura), ...infraOutros((l.specs||{}).infraestrutura)])]};
    off.copies = [...(off.copies||[]), ...(l.copies||[])]; if (l.ai_training && !String(off.ai_training||"").includes(l.ai_training)) off.ai_training = [off.ai_training, l.ai_training].filter(Boolean).join("\n\n");
    if (!off.lat && l.lat){ off.lat = l.lat; off.lng = l.lng; }
    for (const m of lotMedia(l.id)) saveDoc("lot_media", {...m, lot_id: off.id});
    saveDoc("loteamentos", {...l, deleted_at: nowISO(), merged_into: off.id}); }
  saveDoc("loteamentos", off);
  let n = 0; for (const s of allSales()) if (lotKey(s.property_name) === k && s.property_name !== off.name){ saveDoc("vendas", {...structuredClone(s), property_name: off.name}); n++; }
  audit("loteamento_merge", {id: "", property_name: off.name}, `Mesclados: ${[...new Set([...grp.lots.map(l => l.name), ...grp.names.keys()])].join(" / ")} → ${off.name} (${n} vendas renomeadas)`);
  toast(`Loteamentos mesclados · ${n} vendas atualizadas`);
}

/* ============ Novo Financeiro: fichas de comissão (corretor · imobiliária · construtora) ============ */
/* Regras definidas pelo gestor: descontos proporcionais antes de dividir; parcela cheia = comissão OU valor do cliente (por ficha);
   corretor recebe junto com a imobiliária (divisão na hora da baixa); corretor vê a parte dele + o total. */
const corPct = s => s.broker_split == null ? 60 : N(s.broker_split);
const SPLITT = {normal: "Dividir", so_corretor: "Só corretor", so_imob: "Só imobiliária"};
const allComms = () => [...allSales().filter(isActive), ...[...st.avulsas.values()].filter(a => !a.deleted_at)];
function getComm(id){ return st.vendas.get(id) || st.avulsas.get(id); }
function planOf(s){
  const its = s.installments || [];
  if (!its.length){ const gross = N(s.commission_value), disc = (s.discounts||[]).reduce((a,d) => a + N(d.value), 0), liq = Math.max(gross - disc, 0), pp = (s.payments||[]).filter(p => (p.kind||"repasse") === "repasse").reduce((a,p) => a + N(p.amount), 0);
    return [{n: 1, avista: true, venc: s.sale_date, cheia: gross, construtora: 0, desconto: disc, tipo: "normal", recebida: !!s.commission_received, data_receb: (s.commission_received_at || "").slice(0,10), pago: s.commission_received ? liq : Math.min(pp, liq), payments: s.payments || []}]; }
  return its.map(i => { const cheia = N(i.cheia) || N(i.gross) || N(i.value), constr = N(i.construtora), desc = N(i.discount), liq = Math.max(cheia - constr - desc, 0);
    return {n: i.number, venc: i.due_date, cheia, construtora: constr, desconto: desc, tipo: i.split || "normal", recebida: !!i.received, data_receb: i.received_date || "", pago: i.received ? liq : Math.min(i.paid != null ? N(i.paid) : instPaid(i), liq), payments: i.payments || []}; });
}
function partsOf(p, s){ const liq = Math.max(p.cheia - p.construtora - p.desconto, 0), c = p.tipo === "so_corretor" ? liq : p.tipo === "so_imob" ? 0 : liq * corPct(s) / 100; return {liq, corretor: c, imob: liq - c}; }
function commSummary(s){
  const P = planOf(s), t = {liq: 0, cor: 0, imob: 0, constr: 0, desc: 0, cheia: 0, recLiq: 0, recCor: 0, recImob: 0, atraso: 0, atrasoCor: 0, n: P.length, nRec: 0, prox: null};
  for (const p of P){ const x = partsOf(p, s), fr = x.liq ? Math.min(p.pago / x.liq, 1) : (p.recebida ? 1 : 0);
    t.liq += x.liq; t.cor += x.corretor; t.imob += x.imob; t.constr += p.construtora; t.desc += p.desconto; t.cheia += p.cheia; t.recLiq += x.liq*fr; t.recCor += x.corretor*fr; t.recImob += x.imob*fr;
    if (p.recebida) t.nRec++; else { if (!p.avista && (p.venc||"") < T){ t.atraso += x.liq*(1-fr); t.atrasoCor += x.corretor*(1-fr); } else if (!t.prox || p.venc < t.prox.venc) t.prox = {...p, ...x}; } }
  t.status = t.nRec === t.n && t.n ? "quitada" : t.atraso > .009 ? "atrasada" : t.recLiq > .009 ? "andamento" : "aberta"; return t;
}
const CST = {quitada: ["Quitada","p-ok"], atrasada: ["Atrasada","p-bad"], andamento: ["Recebendo","p-warn"], aberta: ["A receber","p-gold"]};
function commTitle(s){ return s.avulsa ? (s.titulo || "Comissão avulsa") + (s.property_name ? " · " + s.property_name : "") : `${s.property_name} · Q ${s.quadra || "–"} L ${s.lote || "–"}`; }
/* grava o plano de volta nos campos que o resto do sistema usa */
function writePlan(s, P){
  const n = structuredClone(s), pct = corPct(n);
  n.installments = P.map((p, i) => { const x = partsOf(p, n), gross = +(p.cheia - p.construtora).toFixed(2);
    return {number: i + 1, due_date: p.venc, cheia: +N(p.cheia).toFixed(2), construtora: +N(p.construtora).toFixed(2), value: gross, gross, discount: +N(p.desconto).toFixed(2), net: +x.liq.toFixed(2), split: p.tipo || "normal", corretor: +x.corretor.toFixed(2), imob: +x.imob.toFixed(2), received: !!p.recebida, received_date: p.recebida ? (p.data_receb || T) : null, payments: p.payments || [], paid: +N(p.pago).toFixed(2), status: p.recebida ? "pago" : N(p.pago) > 0 ? "parcial" : (p.venc||"") < T ? "vencida" : "pendente"}; });
  const sum = k => +n.installments.reduce((a,i) => a + N(i[k]), 0).toFixed(2);

  if (n.commission_rate && n.sale_value){ const base = n.commission_base === "financed" ? N(n.financed_value) : N(n.sale_value); if (Math.abs(base * n.commission_rate / 100 - n.commission_value) > 1) n.commission_rate = 0; }
  return n;
}

/* Regra do gestor: o valor que a construtora paga é o BRUTO; a nota (ex.: 6%) sai do bruto; o corretor fica com o % do loteamento
   (ex.: Portal dos Ventos 66,6% = 4 de 6) sobre o líquido. A parcela é abatida pelo valor CHEIO (bruto), para não sobrar "falta" de nota. */
const rulesDoc = () => (st.config.get("regras_lot") || {id: "regras_lot", itens: {}});
const getRule = name => rulesDoc().itens[lotKey(name || "")] || null;
function saveRules(itens){ saveDoc("config", {...rulesDoc(), id: "regras_lot", itens}); }
const pctFor = s => { const r = getRule(s.property_name); return r && r.pct != null ? N(r.pct) : corPct(s); };

/* ---- leitura da planilha da construtora (sem IA quando o formato é conhecido) ---- */
const stripCode = s => String(s || "").replace(/^\s*\d+\s*-\s*/, "").trim();
function parseConstrutoraSheet(wb){
  const out = [];
  for (const sn of wb.SheetNames){ const A = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, raw: true, defval: null});
    const hi = A.findIndex(r => r && r.some(c => /unidade/i.test(String(c||""))) && r.some(c => /valor/i.test(String(c||"")))); if (hi < 0) continue;
    const H = A[hi].map(c => norm(String(c || ""))), col = re => H.findIndex(h => re.test(h));
    const ci = {emp: col(/empreend/), un: col(/unidade/), cli: H.indexOf("cliente") >= 0 ? H.indexOf("cliente") : col(/^cliente|nome/), ctr: col(/contrato/), val: col(/^valor/), par: col(/parcela/), ven: col(/venc/), cor: col(/^corretor/)};
    for (const r of A.slice(hi + 1)){ if (!r) continue; const v = r[ci.val], un = r[ci.un]; if (typeof v !== "number" || !un) continue;
      let d = r[ci.ven]; if (typeof d === "number") d = new Date(Math.round((d - 25569) * 864e5)).toISOString().slice(0,10); else if (d instanceof Date) d = d.toISOString().slice(0,10); else d = String(d || "").replace(/^(\d{2})\/(\d{2})\/(\d{4}).*/, "$3-$2-$1").slice(0,10);
      const m = String(un).match(/QD[-\s.]*([\w]+)\s*[-\s/]*LT[-\s.]*([\w]+)/i), pc = String(r[ci.par] || "").match(/(\d+)\s*\/\s*(\d+)/), corr = ci.cor >= 0 ? stripCode(r[ci.cor]) : "";
      out.push({loteamento: ci.emp >= 0 ? stripCode(r[ci.emp]) : "", unidade: String(un), quadra: m ? m[1] : "", lote: m ? m[2] : "", cliente: stripCode(r[ci.cli]), contrato: String(r[ci.ctr] ?? ""), valor: +v, parcela: pc ? +pc[1] : 0, de: pc ? +pc[2] : 0, data: d, corretor_arquivo: /imobiliaria|imobiliária|brilhante/i.test(corr) ? "" : corr}); } }
  return out;
}
function findSaleFor(l){
  const nz = x => norm(x).replace(/^0+/, ""), lk = l.loteamento ? norm(l.loteamento).split(" ").filter(w => w.length > 2) : [];
  let C = allSales().filter(s => isActive(s) && l.quadra && nz(s.quadra) === nz(l.quadra) && nz(s.lote) === nz(l.lote) && (!lk.length || lk.some(w => norm(s.property_name).includes(w))));
  const cw = new Set(norm(l.cliente).split(" ").filter(w => w.length > 2)), sc = s => norm(s.client_name).split(" ").filter(w => cw.has(w)).length;
  if (!C.length && cw.size) C = allSales().filter(s => isActive(s) && sc(s) >= 2 && (!lk.length || lk.some(w => norm(s.property_name).includes(w))));
  return C.sort((a,b) => sc(b) - sc(a));
}
const payRef = l => ["cst", l.contrato, l.parcela + "/" + l.de, l.data, (+l.valor).toFixed(2)].join("|");
const alreadyImported = (s, ref) => planOf(s).some(p => (p.payments||[]).some(pg => pg.ref === ref));
function splitLine(s, v){ const r = getRule(s.property_name), pct = r && r.pct != null ? N(r.pct) : corPct(s), nota = +(v * N(r && r.nota) / 100).toFixed(2), liq = +(v - nota).toFixed(2), cor = +(liq * pct / 100).toFixed(2); return {pct, notaPct: N(r && r.nota), nota, liq, cor, imob: +(liq - cor).toFixed(2)}; }
function applyConstrutoraPayment(s, l, date){
  const sp = splitLine(s, l.valor), cur = {...structuredClone(s), broker_split: sp.pct}, P = planOf(cur).map(q => ({...q}));
  let q = P.length > 1 && P.length === l.de ? P.find(x => x.n === l.parcela && !x.recebida) : null; if (!q) q = P.find(x => !x.recebida) || P[P.length - 1];
  q.payments = [...(q.payments||[]), {amount: l.valor, discount: sp.nota, date: date || l.data || T, method: "Construtora", notes: `Parcela construtora ${l.parcela}/${l.de} · contrato ${l.contrato}`, origem: "Planilha da construtora", ref: payRef(l), by: myName(), at: nowISO()}];
  q.desconto = +(q.desconto + sp.nota).toFixed(2); const liq = Math.max(q.cheia - q.construtora - q.desconto, 0); q.pago = +Math.min(q.pago + sp.liq, liq).toFixed(2); if (q.pago >= liq - .009){ q.recebida = true; q.data_receb = date || l.data || T; q.pago = liq; }
  const nn = writePlan(cur, P); saveComm(nn); return {nn, sp};
}
